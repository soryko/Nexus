name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    # Naming bash explicitly is what turns on `-o pipefail`; the implicit default is `bash
    # -e` without it, under which a piped command's failure is hidden by the exit status of
    # whatever it is piped into. A push was made from this repository on a green `tail`
    # masking a red pytest, so this is not a hypothetical.
    shell: bash

env:
  # The uv release pins the embedded interpreter download index, so this pins which builds
  # exist at all, not merely which resolver runs. 0.11.21 is the version the interpreter
  # below was verified against; an older one does not carry that build.
  UV_VERSION: "0.11.21"
  # Pins the interpreter build, not merely the series. The suite's floor is a property of
  # the SQLite the interpreter is linked against, which varies between builds of one
  # version, so "3.13" would not be a pin of the thing that matters. This is not the
  # 3.13.15 development uses: that patch is Homebrew's and has no build here, which the
  # first run of this workflow discovered. 3.13.14 carries SQLite 3.53.1, above the floor;
  # the runtime check below is what confirms that on the runner rather than assuming it.
  UV_PYTHON: "3.13.14"
  NEXUS_DIAGNOSTICS_DIR: ${{ github.workspace }}/artifacts/diagnostics

jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Pinned to the commits the reviewed run executed, not to a tag: a tag is a movable
      # name, so `@v7` is a promise that whatever it points at later is still what was
      # reviewed. These SHAs are what `v7`/`v7.0.1` resolved to in the official repositories
      # and what the green run actually downloaded. Upgrades are now an explicit edit here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv ${{ env.UV_VERSION }}
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the pinned interpreter and the frozen dependencies
        run: |
          uv python install "$UV_PYTHON"
          uv sync --frozen

      - name: Record and verify the test runtime
        run: uv run python .github/scripts/verify_runtime.py

      - name: Suite
        run: |
          mkdir -p artifacts/junit
          uv run pytest -q --junitxml=artifacts/junit/suite.xml

      # Both matrices, in one invocation separate from the suite so neither can hide the
      # other's exit status. B2b's is added here rather than left to the development run:
      # a matrix that only ever runs locally stops being evidence the first time nobody
      # runs it.
      - name: Mutation matrix
        env:
          NEXUS_MUTATION_MATRIX: "1"
        run: |
          uv run pytest -q tests/core/test_b2a_mutations.py tests/core/test_b2b_mutations.py \
            --junitxml=artifacts/junit/mutations.xml

      # The benchmark harness is not covered by the product suite: its defects are in the
      # driver, the accounting, the gate and the selection rule, none of which `tests/`
      # imports. These suites are deterministic -- they stub every subprocess and never
      # invoke `sandbox-exec`, so they run on Linux. The macOS sandbox and isolation probes
      # are host verification and are captured separately by `make-verification.sh`.
      #
      # `test_report_calibration.py` covers freeze-calib-a2 §5. A rule applied only by hand
      # is how two COMPLETE ceilings came to be read as two QUALIFYING ceilings.
      # `test_diagnose_workflow.py` covers the workflow diagnostic's classifier: its report
      # concludes that 10 of 11 failing arm-runs never wrote to `src/`, which a detector
      # silently missing a write would invert.
      # `test_interpreter_pinning.py` covers the interpreter repair. It stubs the shell rather
      # than running it, so the decision logic is exercised where the fixtures do not exist --
      # and the defect it closes was a gate that probed one shell startup and passed.
      # `test_a2r.py` covers A2-R's assessment and its SEPARATE accounting. Two of its cases
      # are the ones a summary count cannot show: an absent `No module named pytest` in a run
      # that never invoked pytest is not a pass, and a comment added under `tests/` is not an
      # extension of the test suite.
      - name: Benchmark harness counterexamples
        run: |
          uv run python benchmarks/agent/test_calibration_counterexamples.py
          uv run python benchmarks/agent/test_diagnose_counterexamples.py
          uv run python benchmarks/agent/test_report_calibration.py
          uv run python benchmarks/agent/test_diagnose_workflow.py
          uv run python benchmarks/agent/test_interpreter_pinning.py
          uv run python benchmarks/agent/test_a2r.py

      # `testpaths = ["tests"]`, so these two pytest files under `benchmarks/agent` are NOT
      # collected by the Suite step above and have to be named. They were written and then
      # would never have run here -- the same shape as the fix-leakage scan that reported
      # "none" on four tasks while gathering no evidence.
      #
      # `test_dev_m1.py` covers the dev-m1 labels AND the leakage scans themselves: a missing
      # clone, a failed diff, missing checks and a deliberately contaminated memory the scan
      # must catch. `test_a3_decision.py` exercises A3's decision table against synthetic
      # outcomes -- a loss on one task not offset by a gain on another, an equivalent memory
      # satisfying a fact, stale advice read and rejected, and unresolved accounting that is
      # indeterminate rather than excluded. Both are deterministic: they build their own git
      # fixtures in a tmpdir and never invoke `sandbox-exec`, so they run on Linux.
      #
      # `test_a3_pipeline.py` is the INTEGRATION rehearsal: schedule -> stubbed execution ->
      # saved records -> real compliance scoring -> normalisation -> decision. It is here
      # because the synthetic decision-table checks cannot reach the join between them, and
      # the join is where the fix-leakage scan's defect lived. It writes 16 arm-runs to a
      # tmpdir and runs the real regression probe over them, so it is the slow one (~80s);
      # it stubs every subprocess but pytest and never invokes `sandbox-exec`.
      #
      # It needs `pyexpat` in the interpreter running pytest HERE, not merely in the one the
      # probe shells out to: `regression_discriminates` parses the JUnit report in its own
      # process. Without it every tree returns `unknown` and every task reports
      # `required_work: indeterminate` -- which reads like a finding. `rehearse_a3` refuses
      # rather than running in that state, so a missing pyexpat fails this step loudly
      # instead of passing it vacuously.
      - name: Benchmark harness pytest suites
        run: |
          uv run pytest -q benchmarks/agent/test_dev_m1.py \
            benchmarks/agent/test_a3_decision.py \
            benchmarks/agent/test_a3_pipeline.py \
            --junitxml=artifacts/junit/bench.xml

      - name: Collect failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
