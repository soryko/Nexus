<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nexus Atlas · Library study</title><style>*{box-sizing:border-box}body{margin:0;background:#191b1d;color:#f5f3ee;font:16px/1.45 system-ui}header,main{max-width:1060px;margin:auto;padding:20px 32px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #454749}header strong{font: bold 24px Georgia}header i{color:#f3b865;font:22px system-ui}small,.sub{color:#b9bcbe}main{display:grid;grid-template-columns:210px 1fr;gap:36px;padding-top:32px}nav{border-right:1px solid #46484a;padding-right:22px}nav h2{font:600 14px system-ui;color:#b9bcbe;margin:23px 0 8px}button{color:inherit;cursor:pointer;background:none;border:0;font:inherit;text-align:left}nav button{display:block;width:100%;padding:7px 10px;border-radius:3px}nav button[aria-pressed=true]{background:#383a3d}button:hover{background:#313337}button:focus-visible,summary:focus-visible{outline:2px solid #f3b865}h1{font:normal clamp(32px,5vw,50px)/1.12 Georgia;margin:0 0 6px}.sub{margin:0 0 24px}article{background:#242629;border-top:1px solid #424447;padding:15px 20px}.home{display:inline-block;color:#f3b865;border-left:5px solid #f3b865;padding-left:8px;font-size:14px;font-weight:600}summary{cursor:pointer;font:23px/1.35 Georgia;margin:6px 0}details p{max-width:55ch}.collection{color:#bdc0c2;font-size:14px}.collection b{font-weight:500;color:#f1efea}#rows{display:grid;gap:4px}@media(max-width:680px){main{display:block}nav{border:0;margin-bottom:20px;padding:0}nav button{display:inline-block;width:auto}header,main{padding:16px}nav h2{margin:10px 0 3px}}
/* Mnemon workbench: 13/20 shell, 12/18 metadata, underline navigation. */body{font:13px/20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#202326}header,main{max-width:1060px;padding:12px 24px}header strong{font:600 15px/22px inherit;font-family:inherit;font-size:15px}header small{font-size:12px}main{display:block}nav{border:0;padding:0;margin:0}nav h2{display:none}nav button{width:auto;display:inline-flex;min-height:28px;padding:3px 9px;font-size:12px}nav button[aria-pressed=true]{background:#393c3f}#tabs{display:flex;gap:22px;border-bottom:1px solid #46484a;margin-bottom:12px}#tabs button{color:#aaaeb2;border-bottom:2px solid transparent;padding:6px 1px 9px}#tabs button[aria-pressed=true]{color:#f5f3ee;border-bottom-color:currentColor}#tabs button:focus-visible{outline:2px solid #f3b865}.filters{margin-bottom:12px}section h1{font:500 14px/22px system-ui;margin:8px 0 0}.sub{font-size:12px;line-height:18px;margin:0 0 10px}#rows{border:1px solid #404347;border-radius:6px;gap:0;overflow:hidden}article{position:relative;display:grid;grid-template-columns:minmax(220px,1.5fr) minmax(150px,1fr) minmax(150px,1fr);align-items:start;gap:12px;padding:8px 12px;background:transparent;border:0;border-bottom:.5px solid #404347}article:last-child{border-bottom:0}details{grid-column:1;grid-row:1}summary{font:500 13px/20px system-ui;margin:0}.home,.collection{font:12px/18px system-ui}.home{grid-column:2;border-width:3px}.collection{grid-column:3}.labels{display:grid;grid-template-columns:minmax(220px,1.5fr) minmax(150px,1fr) minmax(150px,1fr);gap:12px;color:#babdc0;padding:5px 12px;font-size:12px}.home{color:#f3b865} @media(max-width:650px){article{display:flex;flex-wrap:wrap;gap:3px 12px}details{order:-1;width:100%}.labels{display:none}header,main{padding:10px 12px}}nav button[hidden]{display:none}

.labels{display:none}#rows{border:0;border-radius:0;max-width:760px}article{display:block;padding:12px 0;border-top:1px solid #414447;border-bottom:0}article h3{font:600 13px/20px system-ui;margin:0;color:#faf8f3}.passage{font:14px/21px system-ui;margin:3px 0 6px;max-width:68ch}footer{display:flex;gap:5px 14px;flex-wrap:wrap}article summary{font:12px/20px system-ui;color:#bfc4c7;width:fit-content;padding:2px 0}article>details{margin-top:3px}.annotation{border-left:2px solid #515658;padding:2px 12px;margin:4px 0 6px;color:#d1d3d4}.annotation p{margin:4px 0}.annotation b{font-weight:550;color:#f5f3ee;margin-right:5px}
</style><header><strong><i aria-hidden="true">▥</i> Nexus Atlas</strong><small>Library preview · sample data</small></header><main><nav aria-label="Browse library"></nav><section><h1 id="title">Library</h1><p class="sub" id="sub"></p><div id="rows"></div></section></main><script>const data=[['Keep revision links stable','Nexus development','Revision history','A link to a revision should still open that revision after the memory is reorganized.'],['Return to the originating turn','DSH plugins','Atlas navigation','Closing Atlas returns you to the chat turn where you opened the memory.'],['Label historical revisions','Nexus development','Revision history','Show the date and revision when displaying an older memory.'],['Show the failing check first','Personal preferences','Debugging','Start a debugging summary with the check that failed.']];const nav=document.querySelector('nav'),rows=document.querySelector('#rows');function choose(label,key,btn){for(const b of nav.querySelectorAll('button'))b.setAttribute('aria-pressed',String(b===btn));document.querySelector('#title').textContent=key<0?'Library':label;document.querySelector('#sub').textContent=key<0?'All memories, across your spaces.':key===1?'Home space · Memories stored here.':'Collection · Memories listed here, in their original homes.';rows.replaceChildren();for(const [t,h,c,p] of data.filter(r=>key<0||r[key]===label)){const a=document.createElement('article');const evidence={'Keep revision links stable':['Design decision','Atlas linking discussion','The rule concerns Nexus record identity, so it belongs with Nexus design decisions.','A link should open the memory after it moves.'],'Return to the originating turn':['Design decision','DSH navigation walkthrough','The return destination is part of DSH navigation, not the contents of the memory.','Closing Atlas returns to chat.'],'Label historical revisions':['Convention','Atlas history review','This convention describes how Nexus presents earlier versions.',null],'Show the failing check first':['Preference','User correction','This is a personal reporting preference that applies beyond one project.',null]}[t];a.innerHTML=`<h3>${t}</h3><p class="passage">${p}</p><footer><span class="home">Home: ${h}</span><span class="collection">Listed in ${c}</span></footer><details><summary>Inspect memory</summary><div class="annotation"><p><b>Source</b> ${evidence[1]} · ${evidence[0]}</p><p><b>Librarian’s filing note</b> ${evidence[2]}</p>${evidence[3]?`<details><summary>Read previous revision</summary><p>${evidence[3]}</p></details>`:'<p>Original revision · no earlier text.</p>'}</div></details>`;rows.append(a)}}function add(l,k){const b=document.createElement('button');b.textContent=l;b.onclick=()=>choose(l,k,b);nav.append(b);return b}const all=add('All memories',-1);for(const [k,n] of [[1,'Home spaces'],[2,'Collections']]){const h=document.createElement('h2');h.textContent=n;nav.append(h);for(const x of new Set(data.map(r=>r[k])))add(x,k)}const tabs=document.createElement('div');tabs.id='tabs';nav.before(tabs);const filters=[...nav.querySelectorAll('button')];function mode(k){for(const f of filters)f.hidden=true;all.hidden=k===-1;const names=new Set(data.map(r=>r[k]));for(const f of filters)if(names.has(f.textContent))f.hidden=false;all.click();for(const t of tabs.children)t.setAttribute('aria-pressed',String(+t.dataset.k===k));if(k!==-1){document.querySelector('#title').textContent=k===1?'Home spaces':'Collections';document.querySelector('#sub').textContent=k===1?'Select a space to browse its stored memories.':'Select a collection to browse across home spaces.'}}for(const [k,n] of [[-1,'Library'],[1,'Home spaces'],[2,'Collections']]){const t=document.createElement('button');t.textContent=n;t.dataset.k=k;t.onclick=()=>mode(k);tabs.append(t)}const labels=document.createElement('div');labels.className='labels';labels.innerHTML='<span>Memory</span><span>Home space</span><span>Collection</span>';rows.before(labels);mode(-1);if(location.hash==='#inspect')rows.querySelector('details').open=true</script></html>
