<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nexus Atlas · Library prototype</title><style>*{box-sizing:border-box}body{background:#202326;color:#efefec;font:13px/20px system-ui;margin:0}main{max-width:1080px;margin:auto;padding:16px 24px}header,footer,.bar,.filters,.meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header,.bar{justify-content:space-between}header{border-bottom:1px solid #424549;padding:0 0 10px}header b{font-size:15px}h1{font-size:19px;margin:18px 0 4px}h2{font-size:14px;margin:0}p{margin:4px 0 10px}small,.muted{font-size:12px;color:#b9bdc2}section{border:1px solid #44484c;border-radius:7px;padding:12px 14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}button,input{font:inherit;color:inherit;border:1px solid #505458;border-radius:4px;background:#282b2e;padding:3px 9px}button{cursor:pointer}button:hover,button[aria-pressed=true]{background:#383c40}button:focus-visible,input:focus-visible{outline:2px solid white}.space{text-align:left;display:flex;flex-direction:column;gap:2px;min-height:91px;padding:8px 10px}.space strong{font-weight:550}.space small:last-child{margin-top:auto}.home{border-left:3px solid #f3b865;padding-left:6px;color:#f3b865}.filters{border-block:1px solid #424549;padding:7px 0;margin-top:9px;gap:5px}.filters input{margin-left:auto}.record{padding:9px 0;border-bottom:1px solid #393c40}.record:last-child{border:0}.record p{margin:5px 0;max-width:82ch}.record time{margin-left:auto;color:#aaaeb2;font-size:12px}.record footer{justify-content:space-between;color:#b4b9bd;font-size:12px}.record footer button{font-size:12px;background:none}.note{padding:5px 9px;background:#2b2e31;color:#d5d7d9}.pill{font-size:11px;border:1px solid #505458;border-radius:4px;padding:0 5px}@media(max-width:630px){main{padding:10px}.grid{grid-template-columns:1fr}.space{min-height:52px}.filters input{width:100%}}nav{display:flex;gap:22px;border-bottom:1px solid #494c50;margin:10px 0 12px}nav button{background:none;border:0;border-radius:0;border-bottom:2px solid transparent;color:#b9bdc2;padding:5px 1px 8px}nav button[aria-selected=true]{color:#f5f3ee;border-bottom-color:currentColor}details{padding:8px 0;border-top:.5px solid #414548}summary{cursor:pointer;font-weight:550}details[open] summary{margin-bottom:6px}.split.inspecting{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,1fr);gap:18px}.split aside{align-self:start;border-left:1px solid #494c50;padding:10px 14px;background:#272a2d}.split aside>.home{display:inline-block;margin-top:10px}.switcher{display:flex;border-bottom:1px solid #505358;gap:12px;margin:10px 0}.switcher button{background:none;border:0;border-radius:0;padding-left:0}.switcher button[aria-pressed=true]{border-bottom:2px solid currentColor}.evidence small{display:block}.record:has(button[aria-expanded=true]){background:#292c30}@media(max-width:650px){.split.inspecting{display:flex;flex-direction:column-reverse}.split aside{width:100%}}</style><main><header><b>Nexus Atlas</b><small>Design preview · sample records</small></header><h1>Library</h1><p class="muted">Browse spaces and inspect the memories filed in them.</p><section><div class="bar"><h2>Memory space directory</h2><small>2 of 3 active for recall</small></div><div class="grid" id="spaces"></div></section><section><div class="bar"><h2 id="heading">Memory content</h2><small id="count"></small></div><div class="filters" id="filters"><input id="q" aria-label="Filter by content" placeholder="Filter by content…"></div><div id="list"></div></section></main><script>const S=['Nexus development','DSH plugins','Personal preferences'],desc=['Nexus storage and revision rules.','Behavior of plugins inside DSH.','How you prefer agents to report.'],D=[[0,'Decision','Keep revision links tied to a revision, even when a memory changes spaces.','Revision history','14:12','This rule concerns the identity of a stored Nexus revision.'],[1,'Decision','When Atlas closes, return to the conversation turn that opened it.','Atlas navigation','13:57','DSH owns the transition back to chat.'],[2,'Preference','Show the failing check before the rest of the test report.','Debugging','11:24','This reporting preference applies across projects.']];let s=-1,k='All';const e=id=>document.getElementById(id);function render(){const hits=D.filter(d=>(s<0||d[0]===s)&&(k==='All'||k===d[1])&&d[2].toLowerCase().includes(e('q').value.toLowerCase()));e('heading').textContent=s<0?'Memory content':S[s]+' · memory content';e('count').textContent=hits.length+' matching';e('list').innerHTML=hits.map(d=>`<article class="record"><div class="meta"><small class="home">${S[d[0]]}</small><span class="pill">${d[1]}</span><time>Today ${d[4]}</time></div><p>${d[2]}</p><footer><span>Collection: ${d[3]}</span><button aria-expanded="false" onclick="let n=this.closest('article').lastElementChild;n.hidden=!n.hidden;this.setAttribute('aria-expanded',!n.hidden)">Filing details</button></footer><p class="note" hidden>Librarian: ${d[5]}</p></article>`).join('')||'No matching memories.';[...e('spaces').children].forEach((b,i)=>b.setAttribute('aria-pressed',i===s));for(const b of e('filters').querySelectorAll('button'))b.setAttribute('aria-pressed',b.textContent===k)}S.forEach((n,i)=>{const b=document.createElement('button');b.className='space';b.innerHTML=`<strong>${n}</strong><small>${desc[i]}</small><small>${i===2?'Inactive':'Active'} for recall · 1 memory</small>`;b.onclick=()=>{s=s===i?-1:i;render()};e('spaces').append(b)});for(const n of ['All','Decision','Preference']){const b=document.createElement('button');b.textContent=n;b.onclick=()=>{k=n;render()};e('filters').insertBefore(b,e('q'))}e('q').oninput=render;render();
const panels=[...document.querySelectorAll('main>section')];const collections=document.createElement('section');panels[1].after(collections);panels.push(collections);collections.innerHTML='<h2>Librarian collections</h2><p class="muted">Browse by topic. Each memory stays in its home space.</p>'+D.map(d=>`<details><summary>${d[3]}</summary><small class="home">Home: ${S[d[0]]}</small><p>${d[2]}</p></details>`).join('');const names=['Spaces','Memories','Collections'];const nav=document.createElement('nav');nav.setAttribute('role','tablist');nav.setAttribute('aria-label','Library views');panels[0].before(nav);const tabs=names.map((n,i)=>{let b=document.createElement('button');b.textContent=n;b.id='tab'+i;b.setAttribute('role','tab');b.setAttribute('aria-controls','pane'+i);panels[i].id='pane'+i;panels[i].setAttribute('role','tabpanel');panels[i].setAttribute('aria-labelledby',b.id);b.onclick=()=>show(i);b.onkeydown=ev=>{let j=({ArrowRight:(i+1)%3,ArrowLeft:(i+2)%3,Home:0,End:2})[ev.key];if(j!==undefined){ev.preventDefault();show(j);tabs[j].focus()}};nav.append(b);return b});function show(i){panels.forEach((p,j)=>{p.hidden=i!==j;tabs[j].setAttribute('aria-selected',i===j);tabs[j].tabIndex=i===j?0:-1})};[...e('spaces').children].forEach((b,i)=>{b.onclick=()=>{s=i;k='All';e('q').value='';render();show(1);tabs[1].focus()}});const reset=document.createElement('button');reset.textContent='All spaces';reset.onclick=()=>{s=-1;render()};e('heading').after(reset);show(0);
const split=document.createElement('div'),ins=document.createElement('aside');split.className='split';e('list').before(split);split.append(e('list'),ins);ins.hidden=true;const oldRender=render;let selected=-1;render=function(){oldRender();ins.hidden=true;split.classList.remove('inspecting');for(const a of e('list').children){const idx=D.findIndex(d=>d[2]===a.querySelector('p').textContent);const b=a.querySelector('footer button');b.textContent='Inspect';b.removeAttribute('onclick');b.onclick=()=>inspect(idx)}};e('q').oninput=render;function inspect(i){selected=i;const d=D[i];ins.hidden=false;split.classList.add('inspecting');for(const b of e('list').querySelectorAll('footer button'))b.setAttribute('aria-expanded',String(b.closest('article').querySelector('p').textContent===d[2]));ins.innerHTML=`<div class="bar"><strong>Selected memory</strong><button aria-label="Close inspector">Close</button></div><small class="home">Home: ${S[d[0]]}</small><p>${d[2]}</p><div class="switcher"><button>Details</button><button>History</button></div><div class="evidence"></div>`;ins.querySelector('.bar button').onclick=()=>{e('list').querySelector('[aria-expanded=true]')?.focus();render()};const btn=[...ins.querySelectorAll('.switcher button')],body=ins.querySelector('.evidence');function select(j){btn.forEach((b,k)=>b.setAttribute('aria-pressed',String(j===k)));body.innerHTML=j===0?`<small>Source</small><p>${['Atlas linking discussion','DSH navigation walkthrough','User correction'][i]}</p><small>Librarian’s filing reason</small><p>${d[5]}</p><small>Collection</small><p>${d[3]}</p>`:i===0?`<small>Revision 2 · Current</small><p>${d[2]}</p><small>Revision 1 · Previous</small><p>Keep links working when a memory moves.</p>`:`<small>Revision 1 · Current</small><p>${d[2]}</p><p>No earlier revision.</p>`}btn.forEach((b,j)=>b.onclick=()=>select(j));select(0)}render();if(location.hash==='#inspector'){show(1);inspect(0)}

const baseInspect=inspect;let decision='pending';inspect=function(i){baseInspect(i);if(i!==0)return;const box=document.createElement('section');box.setAttribute('aria-label','Librarian proposal');ins.append(box);if(decision!=='pending'){box.textContent=decision==='kept'?'Decision: kept in Nexus development.':'Decision: moved to DSH plugins.';return}box.innerHTML='<h2>Proposed move</h2><small>Not applied</small><p>Current home: <b>Nexus development</b><br>Proposed home: <b>DSH plugins</b></p><p>Librarian’s suggestion: file this rule with plugin navigation because it concerns links opened from DSH.</p><p><b>Recall impact</b><br>Sessions searching only Nexus development would no longer find this memory. Sessions searching DSH plugins could find it there.</p><button>Keep here</button> <button>Move memory</button>';const [keep,move]=box.querySelectorAll('button');keep.onclick=()=>{decision='kept';inspect(0)};move.onclick=()=>{decision='moved';D[0][0]=1;D[0][5]='You accepted the Librarian’s suggestion to file this rule with DSH plugins.';for(let j=0;j<S.length;j++){const n=D.filter(x=>x[0]===j).length;e('spaces').children[j].lastElementChild.textContent=(j===2?'Inactive':'Active')+' for recall · '+n+(n===1?' memory':' memories')}collections.querySelector('.home').textContent='Home: DSH plugins';render();if(s===-1||s===1)inspect(0)}};show(1);inspect(0)}
</script></html>
